name: ScreenCastMac
options:
  bundleIdPrefix: org.screencast
  createIntermediateGroups: true
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    # The app is a local tool: keep the Swift 5 concurrency checking level, no strict mode.
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ScreenCastMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ScreenCast
        PRODUCT_BUNDLE_IDENTIFIER: ${MACOS_BUNDLE_ID}
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The C ABI is pulled in through a bridging header, as required.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/ScreenCastBridge.h
        # `screencast_core.h` resolves from the repository, not from the built xcframework, so the
        # header Swift sees is byte-identical to the one native/tools/header_smoke.c compiles.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../native/include
        ALWAYS_SEARCH_USER_PATHS: NO
        # No sandbox: ScreenCaptureKit capture plus CGEvent injection inside a sandbox is a lot of
        # entitlement plumbing for a tool that only runs on the user's own machine.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        DEVELOPMENT_TEAM: ''
        COMBINE_HIDPI_IMAGES: YES
        # Intel MacBooks (x86_64) are a first-class target: always ship a universal binary.
        # ONLY_ACTIVE_ARCH would drop x86_64 when building Debug on Apple silicon.
        ARCHS: 'arm64 x86_64'
        ONLY_ACTIVE_ARCH: NO
        SUPPORTED_PLATFORMS: 'macosx'
        # The Rust staticlib needs the Apple resolver/iconv shims it references through std.
        OTHER_LDFLAGS:
          - $(inherited)
          - -liconv
          - -lresolv
          - -framework
          - CoreFoundation
          - -framework
          - Security
    dependencies:
      - framework: Frameworks/ScreenCastCore.xcframework
        embed: false
schemes:
  ScreenCastMac:
    build:
      targets:
        ScreenCastMac: all
    run:
      config: Debug
    archive:
      config: Release
